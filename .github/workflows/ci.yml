  #   needs: check
  #   if: github.ref == 'refs/heads/monorepo'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Trigger Coolify deploy
  #       run: curl -fsS -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
